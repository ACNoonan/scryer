# M3.6 Phase B. CEX stock-perp bid/ask tape across the configured
# xStock underlier set, 60s cadence — exercises per-manifest tick mode
# (`scryer-runner tick --only cex-stock-perp-tape`) under a dedicated
# launchd plist.
#
# The fetcher launches 11 CEX venue adapters concurrently and stamps
# each returned batch with one capture_id plus local availability
# microseconds. Per-call rate-limit-ms keeps each venue's symbol loop
# under its own cap. Wall-clock per fire is dominated by the slowest
# venue.
#
# Soak attribution: legacy plist
# `com.adamnoonan.scryer.cex-stock-perp-tape` still loaded; both write
# `cex_stock_perp_tape.v1` rows. The legacy plist's CLI doesn't pass
# `--source`, so its rows carry the upstream's per-venue `_source`
# unchanged. After cutover, only the runner-driven plist remains.

id = "cex-stock-perp-tape"
description = "Decision-time CEX stock-perp bid/ask cohorts across the canonical xStock underliers, every 60s."
schema_ids = ["cex_stock_perp_tape.v1"]

[fetch]
command = "scry"
args = [
    "cex-stock-perp", "tape",
]

[criticality]
tier = "tier-1"
owner = "@adam"
consumer_impact = "Timed multi-venue CEX perp bid/ask cohorts for xStock underliers. Input for executable crossed-book feasibility and per-venue liquidity tracking. Stale = forward alpha-observatory gap."

[freshness]
# 2x cadence — alert if no fresh row inside 120s.
sla_secs = 120

[workflow]
sensor = "interval(60s)"
